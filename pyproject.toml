[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agenttrust-kye"
version = "1.0.0"
description = "AgentTrust KYE — Runtime Canary Uptime, Anti-Rug-Pull & x402 Firewall Oracle for MCP Servers and AI Agent APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Edmund Hu", email = "edmundhu@helloyunivia.com" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "x402",
  "security",
  "tool-poisoning",
  "kye",
  "know-your-endpoint"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[project.urls]
Homepage = "https://github.com/heroson86462-hsnu/agenttrust-kye"
Repository = "https://github.com/heroson86462-hsnu/agenttrust-kye"
Issues = "https://github.com/heroson86462-hsnu/agenttrust-kye/issues"

[project.scripts]
agenttrust-kye = "agenttrust_kye.stdio_mcp:main"
agenttrust-kye-mcp = "agenttrust_kye.stdio_mcp:main"
agenttrust-kye-server = "agenttrust_kye.server:run_cli"
agenttrust-kye-harvest = "agenttrust_kye.harvester:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrust_kye"]
